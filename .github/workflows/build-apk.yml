
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Build APK
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT }}

      - uses: actions/upload-artifact@v4
        with:
          name: AVMixer-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
